name: Hayes Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hayes-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chay bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: python watcher.py

      - name: Luu state.json
        run: |
          git config user.name "hayes-bot"
          git config user.email "hayes-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi"
          else
            git commit -m "Cap nhat state"
            git pull --rebase || true
            git push
          fi
